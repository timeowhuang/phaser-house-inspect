<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <title>The Silent House · Phaser 互动探索</title>
  <meta name="description" content="使用 Phaser 构建的互动房间与 3D 道具检视体验">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    :root{--bone:#d8ccb0;--gold:#b9a06a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050607;color:var(--bone);overflow:hidden;font-family:Arial,Helvetica,sans-serif}.shell{width:100vw;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#232321 0,#0b0d0f 52%,#030405 100%)}.frame{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden;box-shadow:0 0 100px #000}.stage,.stage canvas{width:100%!important;height:100%!important;display:block}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 45px rgba(0,0,0,.9);background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px)}.hud{position:absolute;z-index:2;left:50%;bottom:7%;transform:translateX(-50%);padding:12px 19px;border:1px solid rgba(201,183,137,.22);background:rgba(6,7,8,.72);backdrop-filter:blur(8px);color:#c4bba5;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;white-space:nowrap}.pulse{display:inline-block;width:6px;height:6px;margin-right:11px;border-radius:50%;background:#c4a765;box-shadow:0 0 12px #d8b968;animation:pulse 1.5s infinite}.controls{position:absolute;z-index:2;right:3.5%;bottom:3.5%;color:#716e67;font-size:11px;letter-spacing:1px}kbd{border:1px solid #4a4740;padding:3px 6px;color:#999184;font-family:inherit}.inspect{position:fixed;z-index:20;inset:0;visibility:hidden;opacity:0;transition:opacity .35s ease,visibility .35s;background:radial-gradient(circle at 65% 45%,#222220 0,#0c0d0e 40%,#030405 80%)}.inspect.open{visibility:visible;opacity:1}.grain{position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}.close{position:absolute;z-index:4;top:34px;right:42px;width:50px;height:50px;border:1px solid #5c574c;border-radius:50%;background:transparent;color:#aaa18e;font-size:30px;cursor:pointer;transition:.2s}.close:hover{color:#fff;border-color:#bbaa84;transform:rotate(90deg)}.copy{position:absolute;z-index:3;left:8vw;top:50%;width:min(340px,32vw);transform:translateY(-50%)}.eyebrow{color:var(--gold);font:11px/1.4 "Courier New",monospace;letter-spacing:3px}.copy h1{margin:22px 0 18px;color:#eee7d7;font:400 clamp(38px,5vw,74px)/.95 Georgia,serif;letter-spacing:.08em}.copy p{color:#8f8b82;font:15px/1.9 Georgia,serif}.rule{width:42px;height:1px;margin:28px 0;background:var(--gold)}.copy small{color:#68655e;font-size:10px;letter-spacing:1.8px}.model{position:absolute;right:3vw;top:4vh;width:65vw;height:92vh;--poster-color:transparent}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 4px #d8b968}}@media(max-width:700px){.frame{width:100vw;height:100dvh;aspect-ratio:auto}.controls{display:none}.hud{bottom:4%;max-width:88vw;overflow:hidden;text-overflow:ellipsis}.copy{left:7vw;top:auto;bottom:6vh;width:86vw;transform:none}.copy h1{margin:10px 0;font-size:42px}.copy p{max-width:70%;margin:0;font-size:12px;line-height:1.5}.rule{margin:14px 0}.model{right:0;top:3vh;width:100vw;height:66vh}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="frame" aria-label="互动书房场景">
      <div id="game" class="stage"></div>
    </div>
    <section id="inspect" class="inspect" aria-hidden="true">
      <div class="grain"></div>
      <button id="close" class="close" aria-label="关闭道具检视">×</button>
      <div class="copy"><span class="eyebrow">ARCHIVE ITEM · 001</span><h1>无名访客</h1><p>在书房的旧木桌上发现。金属表面没有氧化，也摸不到任何接缝。</p><div class="rule"></div><small>拖动旋转 · 滚轮缩放 · ESC 返回</small></div>
      <model-viewer class="model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="一尊可旋转观察的神秘金属人像" camera-controls disable-pan shadow-intensity="1.4" shadow-softness=".8" environment-image="neutral" exposure="0.65" camera-orbit="35deg 75deg 2.4m" min-camera-orbit="auto auto 1.6m" max-camera-orbit="auto auto 4m"></model-viewer>
    </section>
  </main>
  <script>
    const inspect=document.querySelector('#inspect');
    function openInspect(){inspect.classList.add('open');inspect.setAttribute('aria-hidden','false')}
    function closeInspect(){inspect.classList.remove('open');inspect.setAttribute('aria-hidden','true')}
    document.querySelector('#close').addEventListener('click',closeInspect);
    addEventListener('keydown',e=>{if(e.key==='Escape')closeInspect()});
    class RoomScene extends Phaser.Scene{preload(){this.load.image('bedroom','assets/village-chief-bedroom.png');this.load.image('ladder','assets/village-chief-ladder.png?v=clean-wall');this.load.image('window','assets/village-chief-window.png?v=sunset')}create(){const views=[this.add.image(640,360,'window').setDisplaySize(1280,720).setAlpha(0),this.add.image(640,360,'ladder').setDisplaySize(1280,720).setAlpha(0),this.add.image(640,360,'bedroom').setDisplaySize(1280,720)];let current=2;const style={fontFamily:'Georgia',fontSize:'72px',color:'#ddd3bd',backgroundColor:'rgba(5,6,7,.42)',padding:{left:18,right:18,top:2,bottom:8}};const left=this.add.text(34,310,'‹',style).setDepth(5).setInteractive({useHandCursor:true}),right=this.add.text(1178,310,'›',style).setDepth(5),up=this.add.text(601,24,'⌃',style).setDepth(5),down=this.add.text(601,606,'⌄',style).setDepth(5);const controls=()=>{[left,right,up,down].forEach(b=>b.setAlpha(0).disableInteractive());if(current===2){left.setAlpha(1).setInteractive({useHandCursor:true});down.setAlpha(1).setInteractive({useHandCursor:true})}else if(current===1){right.setAlpha(1).setInteractive({useHandCursor:true})}else{up.setAlpha(1).setInteractive({useHandCursor:true})}};const turn=next=>{if(next===current)return;const previous=views[current],incoming=views[next].setAlpha(0);current=next;controls();this.tweens.add({targets:previous,alpha:0,duration:330,ease:'Sine.easeInOut'});this.tweens.add({targets:incoming,alpha:1,duration:330,ease:'Sine.easeInOut'})};left.on('pointerdown',()=>current===2&&turn(1));right.on('pointerdown',()=>current===1&&turn(2));down.on('pointerdown',()=>current===2&&turn(0));up.on('pointerdown',()=>current===0&&turn(2));this.input.keyboard.on('keydown-LEFT',()=>current===2&&turn(1));this.input.keyboard.on('keydown-RIGHT',()=>current===1&&turn(2));this.input.keyboard.on('keydown-DOWN',()=>current===2&&turn(0));this.input.keyboard.on('keydown-UP',()=>current===0&&turn(2));controls()}}
    new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:720,backgroundColor:'#090a0c',scene:RoomScene,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
  </script>
</body>
</html>
